<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback - Bloom</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #ffffff;
        margin: 0;
        padding: 0;
      }
      .feedback-container {
        max-width: 600px;
        margin: 50px auto;
        background-color: #ffffff;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(184, 27, 90, 0.2);
      }
      h2 {
        text-align: center;
        color: #000000;
      }
      label {
        display: block;
        margin: 15px 0 5px;
        font-weight: bold;
      }
      input[type="text"],
      input[type="email"],
      textarea,
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
      }
      textarea {
        resize: vertical;
        min-height: 100px;
      }
      button {
        background-color: #d4a373;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 20px;
        width: 100%;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg mt-2">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">BLOOM</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a
                class="nav-link active"
                aria-current="page"
                href="./dashboard.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./tutorial1.html">Tutorial</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Explore
              </a>
              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="./add-product.html"
                    >Add Product</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" href="./my-products.html"
                    >View Product</a
                  >
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" href="./cart.html">Cart</a>
                </li>
                <li>
                  <a class="dropdown-item" href="./my-orders.html">Orders</a>
                </li>
                <li>
                  <a class="dropdown-item" href="./canvas.html">Draw</a>
                </li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./index.html">SignUP</a>
            </li>
          </ul>

          <div class="wrap-input-17">
            <div class="search-box">
              <button class="btn-search">🔍</button>
              <input
                type="text"
                class="input-search"
                placeholder="Type to Search..."
              />
            </div>
          </div>
        </div>
      </div>
    </nav>
    <div class="feedback-container">
      <h2>Feedback Form</h2>
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="rating">How would you rate your experience?</label>
        <select id="rating" name="rating" required>
          <option value="">-- Select Rating --</option>
          <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
          <option value="4">⭐⭐⭐⭐ Good</option>
          <option value="3">⭐⭐⭐ Average</option>
          <option value="2">⭐⭐ Poor</option>
          <option value="1">⭐ Very Poor</option>
        </select>

        <label for="message">Your Feedback:</label>
        <textarea
          id="message"
          name="message"
          placeholder="Share your thoughts..."
          required
        ></textarea>

        <button onclick="showAlert()" type="submit">Submit Feedback</button>
      </form>
    </div>

    <!--Footer-->
    <div class="container">
      <footer
        class="row row-cols-1 row-cols-sm-2 row-cols-md-5 py-5 my-5 border-top mx-6"
      >
        <div class="col mb-3">
          <a
            href="/"
            class="d-flex align-items-center mb-3 link-body-emphasis text-decoration-none"
          >
            <svg class="bi me-2" width="40" height="32">
              <use xlink:href="#bootstrap"></use>
            </svg>
          </a>
          <p class="text-body-secondary">
            <a href="dashboard.html">© BLOOM 2025 </a>
          </p>
        </div>

        <div class="col mb-3"></div>

        <div class="col mb-3">
          <h5>Section</h5>
          <ul class="nav flex-column">
            <li class="nav-item mb-2">
              <a
                href="./dashboard.html"
                class="nav-link p-0 text-body-secondary"
                >Home</a
              >
            </li>
            <li class="nav-item mb-2">
              <a href="./contact.html" class="nav-link p-0 text-body-secondary"
                >Contact Us</a
              >
            </li>

            <li class="nav-item mb-2">
              <a href="./feedback.html" class="nav-link p-0 text-body-secondary"
                >FAQs</a
              >
            </li>
            <li class="nav-item mb-2">
              <a href="./aboutus.html" class="nav-link p-0 text-body-secondary"
                >About</a
              >
            </li>
          </ul>
        </div>
      </footer>
    </div>
    <script>
      function showAlert() {
        alert(
          "Thank you for giving us feedback Bloom! We'll get back to you soon."
        );
        return false; // Prevent form submission for now
      }
    </script>
  </body>
</html>
