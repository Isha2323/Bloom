    <style>
      #productsContainer {
        text-align: center;
        padding: 20px;
      }

      #myProducts {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px; /* Spacing between products */
        padding: 20px;
      }

      .product-card {
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        padding: 15px;
        text-align: center;
        width: 250px; /* Fixed width */
        height: 400px; /* Fixed height */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      /* 🔥 Hover effect: Moves the card upwards */
      .product-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      }

      .product-image {
        width: 100%;
        height: 150px; /* Fixed height */
        object-fit: cover; /* Keeps images uniform */
        border-radius: 10px;
      }

      button {
        background-color: #c69c6d; /* Brownish color */
        border: none;
        width: 200px;
        padding: 10px;
        color: white;
        cursor: pointer;
        border-radius: 5px;
        font-size: 14px;
        margin: 5px;
        transition: background 0.3s;
      }

      button:hover {
        background-color: #a67c52; /* Darker shade on hover */
      }

      /*FORM*/
      /* Modal Styling */
      .modal {
        display: none; /* Initially hidden */
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5); /* Dark overlay */
        align-items: center;
        justify-content: center;
      }

      .modal-content {
        background: white;
        padding: 20px;
        border-radius: 10px;
        width: 350px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        position: relative;
        text-align: center;
        animation: fadeIn 0.3s ease-in-out;
      }

      /* Close Button */
      .close {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 24px;
        cursor: pointer;
      }

      /* Form Styling */
      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      .modal button {
        background-color: #c69c6d;
        color: white;
        border: none;
        padding: 10px;
        width: 100%;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s;
      }

      .modal button:hover {
        background-color: #a67c52;
      }

      /* Smooth Fade-In Effect */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
