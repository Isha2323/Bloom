    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
      }

      #orders {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        margin-top: 30px;
        margin-left: 20px;
        margin-right: 20px;
      }

      .order-card {
        width: 300px;
        background: white;
        border-radius: 10px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        transition: transform 0.2s ease-in-out;
      }

      .order-card:hover {
        transform: translateY(-10px); /* Moves card up */
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3); /* Adds a stronger shadow */
      }

      .product-image {
        margin: 10px;
        width: 90%;
        height: 200px;
        object-fit: cover;
      }

      .order-details {
        padding: 15px;
      }

      .order-details h3 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      .order-details p {
        margin: 5px 0;
        font-size: 14px;
        color: #333;
      }

      .status {
        font-weight: bold;
        padding: 5px;
        border-radius: 5px;
        display: inline-block;
      }

      .status.pending {
        font-style: none;
        background-color: #d4a373;
        color: #ffffff;
      }

      .status.completed {
        background-color: #28a745;
        color: white;
      }

      .status.canceled {
        background-color: #dc3545;
        color: white;
      }

      .no-orders {
        text-align: center;
        font-size: 18px;
        color: #888;
      }

      /*.cancel-btn {
